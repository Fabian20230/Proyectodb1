spring.application.name=padron-app
server.port=8080

## Origen de datos: sqlserver (real) o memory (solo desarrollo; usa el perfil "memoria")
app.storage=sqlserver

## Base de datos (SQL Server). Por defecto asume que la app corre en el mismo servidor que la BD.
## Las credenciales NUNCA se escriben aqui: se leen de variables de entorno DB_USER y DB_PASSWORD.
## Para apuntar a otro equipo: DB_HOST=172.16.0.100   (puerto DB_PORT, base DB_NAME)
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:PadronJutiapa};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

## CORS: solo hace falta si el frontend se prueba por separado (npm run dev usa 5173).
## Varios origenes separados por coma.
app.cors.allowed-origins=http://localhost:5173

## Documentacion interactiva de la API: http://localhost:8080/swagger-ui.html
