## Perfil "local": pruebas con un SQL Server instalado en tu computadora.
## Ejecutar con:  mvn -pl app spring-boot:run -Dspring-boot.run.profiles=local
## OJO: si tu instancia local es con nombre (SQLEXPRESS), usa en la url  localhost\\SQLEXPRESS  y quita el puerto.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=${DB_NAME:PadronJutiapa};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
